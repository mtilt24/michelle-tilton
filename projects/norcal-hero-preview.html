<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorCal Pool Productions</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #E5751F;
  --orange-dk: #c9641a;
  --charcoal: #1F2328;
}
body {
  font-family: 'Public Sans', sans-serif;
  background: var(--charcoal);
  color: #fff;
  overflow: hidden;
  height: 100vh;
}

.ncp-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 56px; height: 72px;
  background: rgba(31,35,40,0.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
}
.ncp-nav-logo img { height: 44px; width: auto; display: block; }
.ncp-nav-links { display: flex; align-items: center; gap: 32px; }
.ncp-nav-links a {
  font-size: 13px; color: rgba(255,255,255,0.5);
  text-decoration: none; font-family: 'Public Sans', sans-serif;
}
.ncp-nav-cta {
  background: #E5751F; color: #fff; border: none;
  border-radius: 5px; padding: 9px 20px; font-size: 15px;
  font-weight: 500; font-family: 'Public Sans', sans-serif;
  text-decoration: none; display: inline-block;
}

.hero {
  position: relative; width: 100%; height: 100vh;
  overflow: hidden; display: flex; align-items: center;
}
.hero-video-wrap {
  position: absolute; inset: 0; z-index: 0; overflow: hidden;
}
.hero-video-wrap video {
  position: absolute; top: 50%; left: 50%;
  min-width: 100%; min-height: 100%;
  width: auto; height: auto;
  transform: translate(-50%, -50%) scale(1.08);
  object-fit: cover;
}
.hero-inner {
  position: relative; z-index: 4;
  padding: 160px 56px 140px; max-width: 640px;
}
.hero h1 {
  font-size: clamp(42px, 5.5vw, 72px);
  font-weight: 300; line-height: 1.04;
  color: #fff; margin-bottom: 24px; letter-spacing: -0.025em;
  text-shadow: 0 2px 24px rgba(0,0,0,0.5);
}
.hero h1 strong { font-weight: 700; }
.hero-sub {
  font-size: 17px; line-height: 1.75;
  color: rgba(255,255,255,0.65); margin-bottom: 44px;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.hero-sub strong { color: rgba(255,255,255,0.9); font-weight: 500; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--orange); color: #fff;
  border-radius: 5px; padding: 13px 26px;
  font-size: 16px; font-weight: 500;
  text-decoration: none; font-family: 'Public Sans', sans-serif;
}
</style>
</head>
<body>
<nav class="ncp-nav">
  <a href="#" class="ncp-nav-logo">
    <img src="https://images.squarespace-cdn.com/content/58ef9f15a5790ae0b26576ce/1492574530052-0EHWAV5NGFU5N5YVYG1G/NorCalLogo.png?content-type=image%2Fpng" alt="NorCal Pool Productions">
  </a>
  <div class="ncp-nav-links">
    <a href="#">What We Build</a>
    <a href="#">How We Build</a>
    <a href="#">Our Work</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
  <a href="#" class="ncp-nav-cta">Get a Free Consultation</a>
</nav>

<section class="hero">
  <div class="hero-video-wrap">
    <video autoplay muted loop playsinline>
      <source src="https://res.cloudinary.com/dstssdnoj/video/upload/v1774760396/Aurora_Vida_Hero_v8jvov.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero-inner">
    <h1>Backyard Dreams,<br><strong>Built Into Reality.</strong></h1>
    <p class="hero-sub">
      Custom pools, spas, and outdoor living spaces across Northern California.
      Every project is <strong>owner-supervised and built to last.</strong>
    </p>
    <a href="#" class="btn-primary">Get a Free Consultation</a>
  </div>
</section>
</body>
</html>
